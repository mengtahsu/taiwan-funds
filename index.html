function renderCards() {
    const count = parseInt(document.getElementById('countSelect').value);
    const typeFilter = document.getElementById('typeFilter').value;
    let filtered = FUNDS;
    if (typeFilter !== 'all') filtered = FUNDS.filter(f => f.type === typeFilter);
    const shown = filtered.slice(0, count);

    document.getElementById('resultCount').textContent =
        '顯示 ' + shown.length + ' / ' + filtered.length + ' 符合條件基金';

    document.getElementById('fundList').innerHTML = shown.map((f, i) => {
        const rc = i < 3 ? 'rank-' + (i+1) : 'rank-other';
        const badge = f.type === 'ETF'
            ? '<span class="badge badge-etf">ETF</span>'
            : '<span class="badge badge-fund">基金</span>';
        const m3c = f.m3 >= 0 ? 'positive' : 'negative';
        const m6c = f.m6 >= 0 ? 'positive' : 'negative';
        const y1c = f.y1 >= 0 ? 'positive' : 'negative';
        const sign3 = f.m3 >= 0 ? '+' : '';
        const sign6 = f.m6 >= 0 ? '+' : '';
        const sign1 = f.y1 >= 0 ? '+' : '';
        return '<div class="fund-card">'
            + '<div class="fund-card-top">'
            + '<div class="fund-card-rank ' + rc + '">' + (i+1) + '</div>'
            + '<div class="fund-card-name"><a href="' + f.url + '" target="_blank" rel="noopener">' + f.name + '</a></div>'
            + '<div class="fund-card-badges">'
            + badge
            + '<span class="badge-score">' + f.score.toFixed(1) + '</span>'
            + '</div></div>'
            + '<div class="fund-card-stats">'
            + '<div class="fund-card-stat">'
            + '<div class="fund-card-stat-label">' + f.company.replace('投信','') + '</div>'
            + '</div>'
            + '<div class="fund-card-stat">'
            + '<div class="fund-card-stat-label">3M</div>'
            + '<div class="fund-card-stat-value ' + m3c + '">' + sign3 + f.m3.toFixed(1) + '%</div>'
            + '</div>'
            + '<div class="fund-card-stat">'
            + '<div class="fund-card-stat-label">6M</div>'
            + '<div class="fund-card-stat-value ' + m6c + '">' + sign6 + f.m6.toFixed(1) + '%</div>'
            + '</div>'
            + '<div class="fund-card-stat">'
            + '<div class="fund-card-stat-label">1Y</div>'
            + '<div class="fund-card-stat-value ' + y1c + '">' + sign1 + f.y1.toFixed(1) + '%</div>'
            + '</div>'
            + '</div></div>';
    }).join('');
}

renderCards();

// Counter: system runtime (global) + your visits (per-browser)
(function() {
    var MY_KEY = 'fund_ranker_myvisits';
    var my = JSON.parse(localStorage.getItem(MY_KEY) || '{"n":0}');
    my.n += 1;
    localStorage.setItem(MY_KEY, JSON.stringify(my));

    var el = document.getElementById('hitCounter');
    fetch('counter.json?' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(c) {
        el.innerHTML = '🌐 ' + (c.page_views || 0) + ' 次瀏覽（' + (c.unique_visitors || 0) + ' 位訪客）| 您瀏覽 ' + my.n + ' 次';
      })
      .catch(function() {
        el.innerHTML = '您瀏覽 ' + my.n + ' 次';
      });
})();
