function renderCards() {
    const count = parseInt(document.getElementById('countSelect').value);
    const typeFilter = document.getElementById('typeFilter').value;
    let filtered = FUNDS;
    if (typeFilter !== 'all') filtered = FUNDS.filter(f => f.type === typeFilter);
    const shown = filtered.slice(0, count);

    document.getElementById('resultCount').textContent =
        '顯示 ' + shown.length + ' / ' + filtered.length + ' 符合條件基金';

    document.getElementById('fundList').innerHTML = shown.map((f, i) => {
        const rc = i < 3 ? 'rank-' + (i+1) : 'rank-other';
        const badge = f.type === 'ETF'
            ? '<span class="badge badge-etf">ETF</span>'
            : '<span class="badge badge-fund">基金</span>';
        const m3c = f.m3 >= 0 ? 'positive' : 'negative';
        const m6c = f.m6 >= 0 ? 'positive' : 'negative';
        const y1c = f.y1 >= 0 ? 'positive' : 'negative';
        const sign3 = f.m3 >= 0 ? '+' : '';
        const sign6 = f.m6 >= 0 ? '+' : '';
        const sign1 = f.y1 >= 0 ? '+' : '';
        const dt3c = f.diff_twii_3m >= 0 ? 'positive' : 'negative';
        const dt6c = f.diff_twii_6m >= 0 ? 'positive' : 'negative';
        const dt1c = f.diff_twii_1y >= 0 ? 'positive' : 'negative';
        const sd3 = f.diff_twii_3m >= 0 ? '+' : ''; const sd6 = f.diff_twii_6m >= 0 ? '+' : '';
        const sd1 = f.diff_twii_1y >= 0 ? '+' : '';
        return '<div class="fund-card">'
            + '<div class="fund-card-top">'
            + '<div class="fund-card-rank ' + rc + '">' + (i+1) + '</div>'
            + '<div class="fund-card-name"><a href="' + f.url + '" target="_blank" rel="noopener">' + f.name + '</a></div>'
            + '<div class="fund-card-company">' + f.company.replace('投信','') + '</div>'
            + '<div class="fund-card-badges">'
            + badge
            + '<span class="badge-score">' + f.score.toFixed(1) + '</span>'
            + '</div></div>'
            + '<div class="fund-row fund-row-head">'
            + '<div class="fund-row-label"></div>'
            + '<div class="fund-row-hdr">3M</div>'
            + '<div class="fund-row-hdr">6M</div>'
            + '<div class="fund-row-hdr">1Y</div>'
            + '</div>'
            + '<div class="fund-row">'
            + '<div class="fund-row-label">報酬</div>'
            + '<div class="fund-row-val ' + m3c + '">' + sign3 + f.m3.toFixed(1) + '%</div>'
            + '<div class="fund-row-val ' + m6c + '">' + sign6 + f.m6.toFixed(1) + '%</div>'
            + '<div class="fund-row-val ' + y1c + '">' + sign1 + f.y1.toFixed(1) + '%</div>'
            + '</div>'
            + '<div class="fund-row">'
            + '<div class="fund-row-label">ΔTWII</div>'
            + '<div class="fund-row-val ' + dt3c + '">' + sd3 + f.diff_twii_3m.toFixed(1) + '%</div>'

            + '<div class="fund-row-val">'
