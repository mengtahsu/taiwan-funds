name: 每日更新基金分析

# 每天台股收盤後（台灣 16:00 = UTC 08:00）自動跑一次，也可手動觸發
on:
  schedule:
    - cron: "0 8 * * 1-5"      # 週一到週五 UTC 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest      # GitHub runner 網路開放，連得到 MoneyDJ（沙盒連不到）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) 抓最新資料 → funds_data.json（失敗會 exit≠0，保留舊資料）
      - name: 抓取市場前 100 強基金
        run: python3 fetch_funds.py

      # 2) 跑演算法 → dip_buy_scores_2026.json
      - name: 執行逢低買進演算法
        run: python3 dip_buy_2026.py

      # 3) 有變動就 commit & push，網頁（analyzer.html）即顯示最新結果
      - name: 提交更新
        run: |
          git config user.name  "fund-bot"
          git config user.email "fund-bot@users.noreply.github.com"
          git add funds_data.json dip_buy_scores_2026.json
          if git diff --cached --quiet; then
            echo "資料無變動，跳過"
          else
            git commit -m "每日更新基金資料與分析 $(date -u +%Y-%m-%d)"
            git push
          fi
